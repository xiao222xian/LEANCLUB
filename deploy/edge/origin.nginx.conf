# Dedicated ingress for the public edge at 47.88.2.70. Installed on 152.136.108.87.
log_format lean_edge_origin '$remote_addr [$time_local] $request_method $uri $status $body_bytes_sent';
server {
    listen 443 ssl;
    server_name leanmuscleclub.com;
    ssl_certificate /etc/nginx/ssl/boji.tensorbot.xyz/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/boji.tensorbot.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set_real_ip_from 47.88.2.70;
    real_ip_header X-Real-IP;
    # Test the transport peer, before the trusted edge's client-IP substitution.
    if ($realip_remote_addr != 47.88.2.70) { return 403; }
    access_log /var/log/nginx/lean-edge-origin.access.log lean_edge_origin;
    server_tokens off;
    location ^~ /api/ {
        client_max_body_size 9m;
        proxy_pass http://127.0.0.1:5381;
        include /etc/nginx/snippets/leanschool-proxy.conf;
    }
    location ^~ /app-api/ {
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:5382;
        include /etc/nginx/snippets/leanschool-proxy.conf;
    }
    location ^~ /admin-api/ {
        client_max_body_size 16m;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:48080;
        include /etc/nginx/snippets/leanschool-proxy.conf;
    }
    location = /infra/ws {
        proxy_pass http://127.0.0.1:48080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $leanschool_connection;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
    location ^~ /console/ {
        root /opt/leanschool/ui/current;
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options nosniff always;
        location ~ /\. { return 404; }
        location /console/assets/ { try_files $uri =404; }
        location /console/brand/ { try_files $uri =404; }
        location ~* \.(?:html|css|js|mjs|map|json|png|jpe?g|webp|gif|svg|ico|avif|woff2?|ttf|otf|eot|txt|xml|pdf|wasm)$ { try_files $uri =404; }
        try_files $uri $uri/ /console/index.html;
    }
    location / { return 404; }
}
