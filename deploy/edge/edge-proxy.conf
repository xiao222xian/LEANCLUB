# Fixed IPv4 transport; verify the origin certificate against its valid DNS name.
proxy_pass https://152.136.108.87;
proxy_ssl_server_name on;
proxy_ssl_name boji.tensorbot.xyz;
proxy_ssl_verify on;
proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
proxy_ssl_verify_depth 3;
proxy_set_header Host leanmuscleclub.com;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
# Original Origin, Referer, Cookie, Authorization and CSRF headers are preserved.
proxy_connect_timeout 8s;
proxy_read_timeout 120s;
proxy_send_timeout 30s;
# Caching defaults to off; only /api/media/ explicitly enables its own zone.
proxy_redirect off;
