log_format lean_edge '$remote_addr [$time_local] $request_method $uri $status $body_bytes_sent';
# Public posters and active versioned QR images only; origin controls TTLs.
proxy_cache_path /var/cache/nginx/lean-public-media levels=1:2 keys_zone=lean_public_media:10m max_size=256m inactive=30d use_temp_path=off;
proxy_cache_path /var/cache/nginx/lean-group-qr levels=1:2 keys_zone=lean_group_qr:2m max_size=32m inactive=1h use_temp_path=off;
upstream lean_shared_origin {
    server 152.136.108.87:443;
    keepalive 16;
    keepalive_timeout 60s;
}
map $http_upgrade $lean_edge_connection { default upgrade; '' ''; }
map $http_user_agent $lean_block_bot {
    default 0;
    ~*(GPTBot|ChatGPT-User|OAI-SearchBot|ClaudeBot|Claude-User|anthropic-ai|PerplexityBot|Perplexity-User|CCBot|Bytespider) 1;
}
server {
    listen 80;
    server_name leanmuscleclub.com www.leanmuscleclub.com;
    location ^~ /.well-known/acme-challenge/ { root /srv/www/leanmuscleclub/acme; }
    location / { return 301 https://leanmuscleclub.com$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name leanmuscleclub.com;
    ssl_certificate /etc/letsencrypt/live/leanmuscleclub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leanmuscleclub.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LEANSSL:10m;
    ssl_session_timeout 1h;
    root /srv/www/leanmuscleclub/current;
    index index.html;
    server_tokens off;
    proxy_cache off;
    autoindex off;
    if ($lean_block_bot) { return 403; }
    access_log /var/log/nginx/leanmuscleclub.access.log lean_edge;
    error_log /var/log/nginx/leanmuscleclub.error.log;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    location ^~ /internal/ { return 404; }
    location ^~ /actuator/ { return 404; }
    location ^~ /druid/ { return 404; }
    location ^~ /v3/api-docs { return 404; }
    location ^~ /swagger { return 404; }
    location = /api/campaign/presentation {
        include /etc/nginx/snippets/lean-edge-proxy.conf;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_cache lean_group_qr;
        proxy_cache_key "$host$uri";
        proxy_cache_lock on;
        proxy_cache_valid 200 15s;
        add_header X-Lean-Media-Cache $upstream_cache_status always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location ^~ /api/media/ {
        include /etc/nginx/snippets/lean-edge-proxy.conf;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_cache lean_public_media;
        proxy_cache_key "$host$uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_valid 200 30d;
        add_header X-Lean-Media-Cache $upstream_cache_status always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location ~ "^/api/campaign/group-qr/[a-f0-9]{32}/[0-9]+$" {
        include /etc/nginx/snippets/lean-edge-proxy.conf;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_cache lean_group_qr;
        proxy_cache_key "$host$uri";
        proxy_cache_revalidate on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_valid 200 30s;
        add_header X-Lean-Media-Cache $upstream_cache_status always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location /api/ { client_max_body_size 9m; include /etc/nginx/snippets/lean-edge-proxy.conf; }
    location ^~ /app-api/ { client_max_body_size 32k; include /etc/nginx/snippets/lean-edge-proxy.conf; }
    location ^~ /admin-api/ { client_max_body_size 16m; include /etc/nginx/snippets/lean-edge-proxy.conf; }
    location = /infra/ws {
        include /etc/nginx/snippets/lean-edge-proxy.conf;
        proxy_set_header Upgrade $http_upgrade;
    }
    location = /console { return 302 /console/; }
    location ^~ /console/ { include /etc/nginx/snippets/lean-edge-proxy.conf; }
    location = /admin { return 302 /console/login?redirect=/leanclub/content; }
    location = /admin/ { return 302 /console/login?redirect=/leanclub/content; }
    location = /legacy-admin { try_files /admin/index.html =404; }
    location = /legacy-admin/ { try_files /admin/index.html =404; }
    location = /check-in { return 302 /console/leanclub/registrations; }
    location = /check-in/ { return 302 /console/leanclub/registrations; }
    location = / { try_files /index.html =404; }
    location = /lean-creator-home.html { return 301 /$is_args$args; }
    location = /index.html { return 301 /$is_args$args; }
    location = /lean-school-ranking.html { return 301 /schools$is_args$args; }
    location = /school-submit.html { return 301 /join$is_args$args; }
    location = /schools { try_files /lean-school-ranking.html =404; }
    location = /schools/ { return 301 /schools$is_args$args; }
    location = /join { try_files /school-submit.html =404; }
    location = /join/ { return 301 /join$is_args$args; }
    location = /design { try_files /design/index.html =404; }
    location = /design/ { try_files /design/index.html =404; }
    location = /city-vote { try_files /city-vote/index.html =404; }
    location = /city-vote/ { try_files /city-vote/index.html =404; }
    location = /events { try_files /events/index.html =404; }
    location = /events/ { try_files /events/index.html =404; }
    location = /ticket { try_files /ticket/index.html =404; }
    location = /ticket/ { try_files /ticket/index.html =404; }
    location ^~ /.well-known/acme-challenge/ { root /srv/www/leanmuscleclub/acme; }
    location ~ /\. { deny all; }
    location ~* \.(?:html|css|js|json)$ {
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location ~* \.(?:webp|png|jpe?g|svg|ico|woff2)$ {
        expires 7d;
        try_files $uri =404;
    }
    location / { try_files $uri =404; }
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
