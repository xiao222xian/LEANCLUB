<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><title>完善学校信息 · Lean Club</title><link rel="stylesheet" href="school-submit.css?v=2"><script defer src="school-submit.js?v=3"></script><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/site-navigation.css?v=1"><script defer src="/site-navigation.js?v=7"></script></head><body><main class="form-page"><a class="brand" href="/">Lean Club<span>校园俱乐部</span></a><div id="loading" role="status">正在读取学校信息…</div><form id="club-form" hidden><div class="field"><label for="school">学校<span>必填</span></label><input id="school" name="school" list="school-options" placeholder="填写学校全称" maxlength="100" minlength="2" autocomplete="organization" required><datalist id="school-options"></datalist></div><div class="field"><label for="contact">负责人联系方式<span>必填</span></label><textarea id="contact" name="contact" rows="3" placeholder="例如：微信号，以及添加时需要备注的内容" maxlength="300" minlength="2" required></textarea></div><div class="field"><label for="count">群人数<span>必填</span></label><input id="count" name="count" type="number" inputmode="numeric" min="1" max="100000" step="1" placeholder="填写当前群人数" required></div><div class="field"><label for="qr">抖音二维码<span>选填</span></label><div class="upload"><input id="qr" type="file" accept="image/jpeg,image/png"><label class="upload-label" for="qr"><span class="plus">＋</span><strong>上传二维码图片</strong><small>JPG / PNG · 最大2MB</small></label><img id="qr-preview" decoding="async" alt="待发布的抖音二维码" hidden><button type="button" id="clear-qr" hidden>使用默认二维码</button></div><p class="hint">未上传时，展示 BOJI Global 联盟抖音二维码。</p></div><p id="form-error" class="error" role="alert" hidden></p><button class="submit" id="publish" type="submit">提交并发布 <span>↗</span></button><p class="hint bottom-hint">提交后即刻展示</p></form><section id="success" hidden aria-live="polite"><div class="success-mark">✓</div><h2>已发布，欢迎同好。</h2><p>学校页面已更新，之后可通过专属链接修改。</p><a id="view-school" class="submit" href="#">查看学校页面 <span>↗</span></a><div class="edit-link-box"><strong>保存快捷修改链接</strong><p>可保存此链接快速修改，也可重新填写学校并提交覆盖。</p><input id="edit-link" readonly aria-label="专属修改链接"><button id="copy-link" type="button">复制修改链接</button><p id="copy-status" role="status"></p></div><button id="edit-again" type="button" class="text-button">继续修改资料</button></section></main></body></html>
