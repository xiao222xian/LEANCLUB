<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>添加资料 · 薄肌学院</title><link rel="icon" href="/assets/brand/leanschool-icon-v1.svg?v=20261025-size2" type="image/svg+xml"><link rel="stylesheet" href="/community.css?v=20261024-1"><script defer src="/community-api.js?v=20261024-1"></script><script defer src="/school-submit.js?v=20261025-global1"></script><link rel="stylesheet" href="/site-filing.css?v=20261023-icp1"><script defer src="/site-filing.js?v=20261024-host"></script></head><body>
<a class="skip" href="#entry-form">跳到表单</a><header class="community-header"><a class="community-brand" href="/">LEAN SCHOOL</a><nav aria-label="主要导航"><a href="/events">线下活动</a><a href="/schools">学校与社群</a><a href="/design/">薄肌设计</a></nav><a class="text-action" href="/schools">浏览资料 ↗</a></header>
<main class="entry-main"><a class="entry-back" href="/schools">← 学校与社群</a><section id="entry-editor"><h1 id="entry-title">添加资料</h1><div id="entry-state" class="entry-state" hidden></div><p id="entry-load-error" class="error" role="alert" hidden></p><button id="entry-reload" type="button" class="secondary entry-reload" hidden>重新读取</button><form id="entry-form">
<div class="entry-types" role="group" aria-label="资料类型"><label><input type="radio" name="kind" value="school">学校</label><label><input type="radio" name="kind" value="group" checked>团体</label><label><input type="radio" name="kind" value="person">个人</label></div>
<label class="entry-field"><span id="entry-name-label">团体名称</span><input name="name" required maxlength="100" placeholder="填写名称" autocomplete="organization"></label>
<div class="entry-location"><label class="entry-field"><span>国家 / 地区<small>可直接填写</small></span><input name="country" list="country-options" required maxlength="60" placeholder="选择或输入，如英国 / UK" autocomplete="country-name"></label><datalist id="country-options"><option value="中国"><option value="中国香港"><option value="中国澳门"><option value="中国台湾"><option value="美国"><option value="英国" label="United Kingdom / UK"><option value="加拿大"><option value="澳大利亚"><option value="新加坡"><option value="日本"><option value="韩国"><option value="德国"><option value="法国"></datalist><label class="entry-field"><span>城市<small>选填</small></span><input name="city" maxlength="100" placeholder="如广州 / London" autocomplete="address-level2"></label></div>
<label class="entry-field" id="entry-school-field"><span>所属学校<small>选填</small></span><input name="schoolName" maxlength="100" placeholder="也可以填写未收录的学校" list="entry-school-options" autocomplete="off"></label><datalist id="entry-school-options"></datalist>
<label class="entry-field" id="entry-contact-field"><span>联系渠道</span><input name="contact" maxlength="300" required placeholder="邮箱、微信或社交主页" autocomplete="off"></label><label class="entry-check" id="entry-contact-public"><input type="checkbox" name="contactPublic">在资料页公开联系方式和二维码</label>
<details class="entry-more"><summary>更多资料<small class="entry-note">选填</small></summary><div><label class="entry-field"><span>英文名 / 别名</span><input name="en" maxlength="200"></label><label class="entry-field"><span>简介</span><textarea name="description" maxlength="600" rows="3" placeholder="简单介绍一下"></textarea></label><label class="entry-field" id="entry-count-field"><span>团体人数</span><input name="count" type="number" min="0" max="100000" step="1" placeholder="选填"></label><label class="entry-field"><span>二维码</span><input id="entry-qr" type="file" accept="image/png,image/jpeg"><small class="entry-note">PNG / JPG，2MB以内</small></label><img id="entry-qr-preview" class="entry-qr-preview" alt="已上传的二维码" hidden><button id="entry-qr-remove" class="text-action" type="button" hidden>移除二维码</button><label class="entry-field" id="entry-qr-label-field" hidden><span>二维码平台</span><input name="qrLabel" maxlength="40" placeholder="如微信 / Instagram"></label></div></details>
<label class="entry-check"><input type="checkbox" name="profilePublic" checked><span id="entry-public-label">审核后公开这份资料</span></label><p id="entry-error" class="error" role="alert" hidden></p><button class="primary entry-submit" id="entry-submit" type="submit">提交资料 <span aria-hidden="true">↗</span></button></form></section>
<section id="entry-success" class="entry-success" hidden aria-labelledby="entry-success-title"><span class="entry-success-mark" aria-hidden="true">✓</span><h2 id="entry-success-title">已提交</h2><p id="entry-success-status">待审核</p><p>保存管理链接，之后可查看进度和修改资料。</p><label class="sr-only" for="entry-manage-link">专属管理链接</label><input id="entry-manage-link" readonly><div class="entry-success-actions"><button id="entry-copy" class="primary" type="button">复制管理链接</button><button id="entry-edit-again" class="secondary" type="button">继续编辑</button></div><p id="entry-copy-status" role="status"></p></section></main><footer class="community-footer"><strong>LEAN SCHOOL</strong><a href="/">返回首页 ↗</a></footer><footer id="site-filing" hidden class="site-filing"><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer"></a></footer></body></html>
