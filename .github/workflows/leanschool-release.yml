name: Build fixed LEAN SCHOOL release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leanschool-fixed-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  backend:
    if: github.repository == 'papaoo/bojizhuye' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MAVEN_OPTS: -Xmx2048m -Dfile.encoding=UTF-8
    steps:
      - name: Checkout workflow tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: ci
          persist-credentials: false
      - name: Checkout fixed backend source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: d5ff0bb3af7683fb4fd1565aed1c58956aca3e6c
          path: backend
          persist-credentials: false
      - name: Download verified Java and Maven distributions
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/temurin25.tar.gz" \
            'https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.5%2B8/OpenJDK25U-jdk_x64_linux_hotspot_25.0.5_8.tar.gz'
          echo '68982529869257d0ee6b824ec5aa270ff8b118bb438670da0b97ebdab178d7fb  '"$RUNNER_TEMP/temurin25.tar.gz" | sha256sum --check --strict
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/maven.tar.gz" \
            'https://archive.apache.org/dist/maven/maven-3/3.9.7/binaries/apache-maven-3.9.7-bin.tar.gz'
          echo 'f64913f89756264f2686e241f3f4486eca5d0dfdbb97077b0efc389cad376053824d58caa35c39648453ca58639f85335f9be9c8f217bfdb0c2d5ff2a9428fac  '"$RUNNER_TEMP/maven.tar.gz" | sha512sum --check --strict
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.7/bin" >> "$GITHUB_PATH"
      - name: Set up exact downloaded Java and dependency cache
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: jdkfile
          java-version: '25.0.5'
          jdk-file: ${{ runner.temp }}/temurin25.tar.gz
          architecture: x64
          overwrite-settings: false
          cache: maven
          cache-dependency-path: backend/**/pom.xml
      - name: Check tools and packaging safeguards
        run: |
          set -euo pipefail
          grep -F 'JAVA_RUNTIME_VERSION="25.0.5+8-LTS"' "$JAVA_HOME/release"
          mvn --version | grep -F 'Apache Maven 3.9.7'
          python3 -m unittest discover -s ci/tests -p test_ci_release.py
          test "$(git -C backend rev-parse HEAD)" = 'd5ff0bb3af7683fb4fd1565aed1c58956aca3e6c'
      - name: Build all reviewed modules
        working-directory: backend
        run: |
          set -euo pipefail
          mvn --settings "$GITHUB_WORKSPACE/ci/deploy/ci/maven-settings.xml" \
            --batch-mode --no-transfer-progress -Dmaven.test.skip=true \
            -Dmaven.wagon.http.retryHandler.count=3 package
      - name: Stamp the actual Linux JAR
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/backend-artifact"
          cp backend/yudao-server/target/yudao-server.jar "$RUNNER_TEMP/backend-artifact/yudao-server.jar"
          python3 ci/deploy/yudao/stamp-release.py --source backend \
            --jar "$RUNNER_TEMP/backend-artifact/yudao-server.jar" \
            --output "$RUNNER_TEMP/backend-artifact/java-release.json"
      - name: Upload only backend code artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: leanschool-backend-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/backend-artifact/yudao-server.jar
            ${{ runner.temp }}/backend-artifact/java-release.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  admin-ui:
    if: github.repository == 'papaoo/bojizhuye' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout workflow tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: ci
          persist-credentials: false
      - name: Checkout fixed admin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 8554101037814965582590b88867e1883352cf0d
          path: admin-ui
          persist-credentials: false
      - name: Set up fixed Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
          architecture: x64
          package-manager-cache: false
      - name: Install fixed pnpm and frozen dependencies
        working-directory: admin-ui
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v24.20.0'
          npm install --global pnpm@10.30.0 --ignore-scripts
          test "$(pnpm --version)" = '10.30.0'
          pnpm install --frozen-lockfile --registry=https://registry.npmmirror.com
      - name: Build console within runner memory budget
        working-directory: admin-ui
        env:
          VITE_BASE_URL: https://build-env-leak.invalid
        run: |
          set -euo pipefail
          node --max_old_space_size=6144 ./node_modules/vite/bin/vite.js build --mode leanschool
      - name: Check generated types and production route isolation
        working-directory: admin-ui
        run: |
          set -euo pipefail
          test -s src/types/auto-imports.d.ts
          test -s src/types/auto-components.d.ts
          node --max_old_space_size=6144 ./node_modules/vue-tsc/bin/vue-tsc.js --noEmit
          node scripts/check-console-deployment.mjs --built
      - name: Package only the console build
        run: |
          python3 ci/deploy/ci/package-public-release.py console \
            --source admin-ui --output "$RUNNER_TEMP/console-artifact"
      - name: Upload only the console archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: leanschool-console-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/console-artifact/console.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  package:
    if: github.repository == 'papaoo/bojizhuye' && github.ref == 'refs/heads/main'
    needs: [backend, admin-ui]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout workflow tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: ci
          persist-credentials: false
      - name: Checkout fixed website source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 1a4ba54b47018e3ed78b013a66f8ac4840b59ca9
          path: website
          persist-credentials: false
      - name: Download this run's backend artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: leanschool-backend-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend-artifact
      - name: Download this run's console artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: leanschool-console-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/console-artifact
      - name: Verify and assemble code-only release
        env:
          TOOLS_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 ci/deploy/ci/package-public-release.py bundle --website website \
            --backend "$RUNNER_TEMP/backend-artifact" --console "$RUNNER_TEMP/console-artifact" \
            --output "$RUNNER_TEMP/leanschool-release" --tools-commit "$TOOLS_COMMIT" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          cd "$RUNNER_TEMP/leanschool-release"
          sha256sum --check --strict SHA256SUMS
      - name: Upload explicit release file allowlist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: leanschool-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/leanschool-release/yudao-server.jar
            ${{ runner.temp }}/leanschool-release/java-release.json
            ${{ runner.temp }}/leanschool-release/console.tar.gz
            ${{ runner.temp }}/leanschool-release/website.tar.gz
            ${{ runner.temp }}/leanschool-release/release-manifest.json
            ${{ runner.temp }}/leanschool-release/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
