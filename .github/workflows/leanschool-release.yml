name: Build LEAN SCHOOL release

on:
  push:
    branches: [main, platform/backend, platform/admin-ui]
  workflow_dispatch:
    inputs:
      website_ref:
        description: Website main branch or complete commit SHA
        default: main
        required: true
        type: string
      backend_ref:
        description: Backend platform/backend branch or complete commit SHA
        default: platform/backend
        required: true
        type: string
      admin_ui_ref:
        description: Console platform/admin-ui branch or complete commit SHA
        default: platform/admin-ui
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: leanschool-build-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  resolve:
    if: github.repository == 'papaoo/bojizhuye'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      website: ${{ steps.resolve.outputs.website }}
      backend: ${{ steps.resolve.outputs.backend }}
      adminUi: ${{ steps.resolve.outputs.adminUi }}
      toolsCommit: ${{ steps.resolve.outputs.toolsCommit }}
    steps:
      - name: Checkout controlled main tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || 'main' }}
          path: ci
          persist-credentials: false
      - name: Resolve source versions once
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_EVENT: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
          WEBSITE_REF: ${{ inputs.website_ref || 'main' }}
          BACKEND_REF: ${{ inputs.backend_ref || 'platform/backend' }}
          ADMIN_UI_REF: ${{ inputs.admin_ui_ref || 'platform/admin-ui' }}
        run: |
          set -euo pipefail
          python3 ci/deploy/ci/resolve-release.py \
            --repository "$REPOSITORY" --event "$WORKFLOW_EVENT" \
            --workflow-ref "$WORKFLOW_REF" --workflow-sha "$WORKFLOW_SHA" \
            --tools-commit "$(git -C ci rev-parse HEAD)" \
            --website-ref "$WEBSITE_REF" --backend-ref "$BACKEND_REF" --admin-ui-ref "$ADMIN_UI_REF" \
            --output "$RUNNER_TEMP/resolved-release.json" --github-output "$GITHUB_OUTPUT"
          python3 -m unittest discover -s ci/tests -p test_ci_release.py
          python3 -m unittest discover -s ci/tests -p test_ci_resolve.py
          python3 -c 'import json,os; r=json.load(open(os.environ["RUNNER_TEMP"]+"/resolved-release.json")); open(os.environ["GITHUB_STEP_SUMMARY"],"a").write("## Resolved source commits\n\n"+"\n".join("- "+k+": `"+v+"`" for k,v in r["commits"].items())+"\n\nThis run builds code only. Production publication is a separate manual workflow.\n")'
      - name: Upload immutable resolution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: leanschool-resolution-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/resolved-release.json
          if-no-files-found: error
          retention-days: 3

  website:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout resolved website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.website }}
          persist-credentials: false
      - name: Set up fixed Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
          architecture: x64
          package-manager-cache: false
      - name: Check website Python and client behavior
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/website-venv"
          "$RUNNER_TEMP/website-venv/bin/pip" install --disable-pip-version-check -r requirements.txt
          "$RUNNER_TEMP/website-venv/bin/python" -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.cjs

  backend:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MAVEN_OPTS: -Xmx2048m -Dfile.encoding=UTF-8
    steps:
      - name: Checkout workflow tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.toolsCommit }}
          path: ci
          persist-credentials: false
      - name: Checkout resolved backend source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.backend }}
          path: backend
          persist-credentials: false
      - name: Download verified Java and Maven distributions
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/temurin25.tar.gz" \
            'https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.5%2B8/OpenJDK25U-jdk_x64_linux_hotspot_25.0.5_8.tar.gz'
          echo '68982529869257d0ee6b824ec5aa270ff8b118bb438670da0b97ebdab178d7fb  '"$RUNNER_TEMP/temurin25.tar.gz" | sha256sum --check --strict
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/maven.tar.gz" \
            'https://archive.apache.org/dist/maven/maven-3/3.9.7/binaries/apache-maven-3.9.7-bin.tar.gz'
          echo 'f64913f89756264f2686e241f3f4486eca5d0dfdbb97077b0efc389cad376053824d58caa35c39648453ca58639f85335f9be9c8f217bfdb0c2d5ff2a9428fac  '"$RUNNER_TEMP/maven.tar.gz" | sha512sum --check --strict
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.7/bin" >> "$GITHUB_PATH"
      - name: Set up exact downloaded Java and dependency cache
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: jdkfile
          java-version: '25.0.5'
          jdk-file: ${{ runner.temp }}/temurin25.tar.gz
          architecture: x64
          overwrite-settings: false
          cache: maven
          cache-dependency-path: backend/**/pom.xml
      - name: Check tools and packaging safeguards
        env:
          BACKEND_COMMIT: ${{ needs.resolve.outputs.backend }}
        run: |
          set -euo pipefail
          grep -F 'JAVA_RUNTIME_VERSION="25.0.5+8-LTS"' "$JAVA_HOME/release"
          mvn --version | grep -F 'Apache Maven 3.9.7'
          python3 -m unittest discover -s ci/tests -p test_ci_release.py
          test "$(git -C backend rev-parse HEAD)" = "$BACKEND_COMMIT"
      - name: Test Lean School contracts with isolated H2 and mocks
        working-directory: backend
        run: |
          set -euo pipefail
          mvn --settings "$GITHUB_WORKSPACE/ci/deploy/ci/maven-settings.xml" \
            --batch-mode --no-transfer-progress -pl yudao-module-leanclub -am \
            -Dmaven.test.skip=false -DskipTests=false -Dsurefire.failIfNoSpecifiedTests=false \
            '-Dtest=TenantSqlBoundaryTest,SiteServiceTest,SiteContentPolicyTest,PublicBoundaryTest,PaymentContractTest,LocalPaymentBindingServiceTest,MemberOrdersSignerTest,MemberOrderServiceTest,MemberOrderInputTest,OperationsSignerTest,LeanClubOperationsServiceTest,BoundedBodySubscriberTest,AppLeanClubOrderControllerTest' test
          python3 -c 'import pathlib,xml.etree.ElementTree as E; r=[E.parse(p).getroot() for p in pathlib.Path("yudao-module-leanclub/target/surefire-reports").glob("TEST-*.xml")]; assert len(r)>=13 and sum(int(x.attrib["tests"]) for x in r)>0; assert all(int(x.attrib.get("errors",0))+int(x.attrib.get("failures",0))==0 for x in r)'
      - name: Build all reviewed modules
        working-directory: backend
        run: |
          set -euo pipefail
          mvn --settings "$GITHUB_WORKSPACE/ci/deploy/ci/maven-settings.xml" \
            --batch-mode --no-transfer-progress -Dmaven.test.skip=true \
            -Dmaven.wagon.http.retryHandler.count=3 package
      - name: Stamp the actual Linux JAR
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/backend-artifact"
          cp backend/yudao-server/target/yudao-server.jar "$RUNNER_TEMP/backend-artifact/yudao-server.jar"
          python3 ci/deploy/yudao/stamp-release.py --source backend \
            --jar "$RUNNER_TEMP/backend-artifact/yudao-server.jar" \
            --output "$RUNNER_TEMP/backend-artifact/java-release.json"
      - name: Upload only backend code artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: leanschool-backend-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/backend-artifact/yudao-server.jar
            ${{ runner.temp }}/backend-artifact/java-release.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  admin-ui:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout workflow tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.toolsCommit }}
          path: ci
          persist-credentials: false
      - name: Checkout resolved admin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.adminUi }}
          path: admin-ui
          persist-credentials: false
      - name: Set up fixed Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
          architecture: x64
          package-manager-cache: false
      - name: Install fixed pnpm and frozen dependencies
        working-directory: admin-ui
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v24.20.0'
          npm install --global pnpm@10.30.0 --ignore-scripts
          test "$(pnpm --version)" = '10.30.0'
          pnpm install --frozen-lockfile --registry=https://registry.npmmirror.com
      - name: Build console within runner memory budget
        working-directory: admin-ui
        env:
          VITE_BASE_URL: https://build-env-leak.invalid
        run: |
          set -euo pipefail
          node --max_old_space_size=6144 ./node_modules/vite/bin/vite.js build --mode leanschool
      - name: Check generated types and production route isolation
        working-directory: admin-ui
        run: |
          set -euo pipefail
          test -s src/types/auto-imports.d.ts
          test -s src/types/auto-components.d.ts
          node --max_old_space_size=6144 ./node_modules/vue-tsc/bin/vue-tsc.js --noEmit
          node scripts/check-console-deployment.mjs --built
      - name: Package only the console build
        env:
          ADMIN_UI_COMMIT: ${{ needs.resolve.outputs.adminUi }}
        run: |
          python3 ci/deploy/ci/package-public-release.py console \
            --source admin-ui --source-commit "$ADMIN_UI_COMMIT" --output "$RUNNER_TEMP/console-artifact"
      - name: Upload only the console archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: leanschool-console-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/console-artifact/console.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  package:
    needs: [resolve, website, backend, admin-ui]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout workflow tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.toolsCommit }}
          path: ci
          persist-credentials: false
      - name: Checkout resolved website source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.website }}
          path: website
          persist-credentials: false
      - name: Download this run's backend artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: leanschool-backend-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend-artifact
      - name: Download this run's console artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: leanschool-console-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/console-artifact
      - name: Download this run's immutable source resolution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: leanschool-resolution-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/resolution
      - name: Verify and assemble code-only release
        run: |
          set -euo pipefail
          python3 ci/deploy/ci/package-public-release.py bundle --website website \
            --backend "$RUNNER_TEMP/backend-artifact" --console "$RUNNER_TEMP/console-artifact" \
            --output "$RUNNER_TEMP/leanschool-release" --resolution "$RUNNER_TEMP/resolution/resolved-release.json" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          cd "$RUNNER_TEMP/leanschool-release"
          sha256sum --check --strict SHA256SUMS
      - name: Upload explicit release file allowlist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: leanschool-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/leanschool-release/yudao-server.jar
            ${{ runner.temp }}/leanschool-release/java-release.json
            ${{ runner.temp }}/leanschool-release/console.tar.gz
            ${{ runner.temp }}/leanschool-release/website.tar.gz
            ${{ runner.temp }}/leanschool-release/release-manifest.json
            ${{ runner.temp }}/leanschool-release/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
